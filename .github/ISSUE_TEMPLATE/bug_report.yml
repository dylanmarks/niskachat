name: 🐛 Bug Report
description: File an issue about broken functionality or unexpected behavior
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug in NiskaChat!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When navigating to Observations tab with large bundles...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Layer
      options:
        - Frontend (Angular / UI)
        - Backend (Express / Proxy)
        - FHIR Parsing / Data Mapping
        - LLM Provider / Streaming
        - Authentication (SMART on FHIR PKCE)
        - CI / Tooling
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open NiskaChat in Offline Mode
        2. Upload synthetic FHIR bundle `sample-bundle.json`
        3. Click on 'Observations' tab
        4. See console error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your browser, Node.js version, and OS.
      placeholder: |
        - OS: macOS Sequoia 15.0 / Ubuntu 24.04
        - Node version: 22.x
        - Browser: Chrome 129
    validations:
      required: false
