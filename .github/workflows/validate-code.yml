name: Validate Code

on: workflow_call

permissions:
  contents: read

jobs:
  called-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint & format verification
        id: lint
        run: npm run lint:all

      - name: Run Angular headless unit tests
        id: frontend-tests
        run: npm run test:ci

      - name: Run Backend Jest unit tests
        id: backend-tests
        run: npm run test:backend

      - name: Generate GitHub Actions Job Summary
        if: always()
        run: |
          echo "### Continuous integration checks" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint and formatting | \`${{ steps.lint.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend tests | \`${{ steps.frontend-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend tests | \`${{ steps.backend-tests.outcome }}\` |" >> $GITHUB_STEP_SUMMARY
