name: Validate Code

on: workflow_call

permissions:
  contents: read

jobs:
  called-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint & format verification
        run: npm run lint:all

      - name: Run Angular headless unit tests
        run: npm run test:ci

      - name: Run Backend Jest unit tests
        run: npm run test:backend

      - name: Generate GitHub Actions Job Summary
        if: always()
        run: |
          echo "### 🧪 Continuous Integration Verification Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint & Format Validation** (\`npm run lint:all\`) | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend Tests** (\`npm run test:ci\`) | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend Tests** (\`npm run test:backend\`) | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Built and validated against Node.js 22 with strict type-checking and conventional commit guidelines." >> $GITHUB_STEP_SUMMARY
